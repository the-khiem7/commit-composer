<!-- Source of ../<id>.webp and ../<id>-dark.webp. Render from the repository root with:
     uvx --from playwright --with pillow python -I <frontdoor-illustrate>/scripts/render.py assets/source/yard.html --root assets --out assets
     Each .item is 1200 CSS px wide, so 2400 px in the image.
     Signature note:
     1. Concept: a railway classification yard; loose wagons (hunks, labelled with the file they carry) roll over the hump and are switched onto tracks, one train per commit.
     2. Shape language: flat wagons with two wheels, double rails on sleeper pattern, a two-lamp signal mast for the gates; no characters, no perspective.
     3. Typeface: Saira Condensed 800 for display, JetBrains Mono for every label and commit title.
     4. Palette logic: slate ground; wagon color is the commit group (amber, green, slate); green lamp = gate passed, red = stop; dark theme raises each accent a step.
     5. Presentation: wide scenes read left to right, mess on the left, commits on the right; labels are real commit titles in the convention's format, with fictional projects.
     6. Not: a git-graph of circles and branches, a gradient, a robot or sparkle for the AI.
     Fonts and grounds printed by render.py: Saira Condensed, JetBrains Mono; light rgb(231, 233, 228), dark rgb(20, 26, 29). -->

<!-- TECH: one diff stream, one awk program, two outputs -->
<div class="item" id="tech-units" style="height:560px">
<svg width="1200" height="560" viewBox="0 0 1200 560">
  <text class="disp" x="60" y="66" font-size="44" fill="var(--ink)">One diff stream, one awk program, one id</text>
  <g font-size="17">
    <!-- source -->
    <g transform="translate(60,110)"><rect width="300" height="250" rx="8" fill="var(--panel)" stroke="var(--ink)" stroke-width="2"/>
      <text x="16" y="34" font-weight="700" fill="var(--ink)">diff_stream</text>
      <text x="16" y="70" fill="var(--ink)">git diff -U0 HEAD</text>
      <text x="16" y="96" fill="var(--muted)">empty tree if no HEAD</text>
      <text x="16" y="136" fill="var(--ink)">+ each untracked file</text>
      <text x="16" y="162" fill="var(--muted)">diff --no-index</text>
      <text x="16" y="188" fill="var(--muted)">/dev/null as new file</text>
      <text x="16" y="228" fill="var(--muted)">staged or not, all count</text></g>
    <!-- awk -->
    <g transform="translate(450,110)"><rect width="300" height="250" rx="8" fill="var(--panel)" stroke="var(--green)" stroke-width="3"/>
      <text x="16" y="34" font-weight="700" fill="var(--ink)">UNITS_AWK</text>
      <text x="16" y="70" fill="var(--ink)">unit = one -U0 hunk</text>
      <text x="16" y="96" fill="var(--muted)">or a whole file:</text>
      <text x="16" y="122" fill="var(--muted)">binary, mode change,</text>
      <text x="16" y="148" fill="var(--muted)">submodule, empty</text>
      <text x="16" y="188" fill="var(--ink)">id = hash(file + body)</text>
      <text x="16" y="214" fill="var(--muted)">twin units get .2, .3</text></g>
    <!-- outputs -->
    <g transform="translate(840,110)"><rect width="300" height="110" rx="8" fill="var(--panel)" stroke="var(--ink)" stroke-width="2"/>
      <text x="16" y="34" font-weight="700" fill="var(--ink)">hunks</text>
      <text x="16" y="66" fill="var(--muted)">id, file, kind,</text><text x="16" y="90" fill="var(--muted)">ranges, counts, preview</text></g>
    <g transform="translate(840,250)"><rect width="300" height="110" rx="8" fill="var(--panel)" stroke="var(--ink)" stroke-width="2"/>
      <text x="16" y="34" font-weight="700" fill="var(--ink)">patch &lt;id&gt; ...</text>
      <text x="16" y="66" fill="var(--muted)">only those units, offsets</text><text x="16" y="90" fill="var(--muted)">recomputed</text></g>
    <g stroke="var(--rail)" stroke-width="4" fill="none"><path d="M360 235 H450"/><path d="M750 235 C800 235 790 165 840 165"/><path d="M750 235 C800 235 790 305 840 305"/></g>
    <!-- apply -->
    <g transform="translate(840,400)"><rect width="300" height="54" rx="8" fill="var(--green)"/><text x="16" y="34" font-weight="700" fill="var(--onwagon)">git apply --cached</text></g>
    <path d="M990 360 V400" stroke="var(--rail)" stroke-width="4"/>
    <text x="60" y="410" fill="var(--ink)" font-weight="700">the agent runs every git command that writes</text>
    <text x="60" y="440" fill="var(--muted)">commitkit.sh only reads and computes</text>
    <text x="60" y="500" fill="var(--muted)">POSIX sh + POSIX awk: dash and mawk, macOS sh and BWK awk, Git for Windows</text>
  </g>
</svg>
</div>

<div class="item" id="tech-offset" style="height:520px">
<svg width="1200" height="520" viewBox="0 0 1200 520">
  <text class="disp" x="60" y="66" font-size="44" fill="var(--ink)">Leave a hunk behind, keep the next one on its line</text>
  <g font-size="17">
    <text x="60" y="118" fill="var(--muted)">auth.go has two hunks. Only hunk 2 is in this commit.</text>
    <!-- full diff -->
    <g transform="translate(60,150)"><rect width="500" height="230" rx="8" fill="var(--panel)" stroke="var(--ink)" stroke-width="2"/>
      <text x="16" y="34" font-weight="700" fill="var(--ink)">the full diff</text>
      <rect x="16" y="56" width="468" height="54" rx="4" fill="var(--slate)"/><text x="30" y="90" font-weight="700" fill="var(--onwagon)">hunk 1  @@ -10,0 +11,3 @@</text>
      <rect x="16" y="126" width="468" height="54" rx="4" fill="var(--amber)"/><text x="30" y="160" font-weight="700" fill="var(--onwagon)">hunk 2  @@ -40,2 +43,2 @@</text>
      <text x="16" y="210" fill="var(--muted)">+43 counts hunk 1's 3 new lines</text></g>
    <path d="M560 265 H640" stroke="var(--rail)" stroke-width="4"/><path d="M630 255 l12 10 l-12 10" stroke="var(--rail)" stroke-width="4" fill="none"/>
    <g transform="translate(650,150)"><rect width="490" height="230" rx="8" fill="var(--panel)" stroke="var(--green)" stroke-width="3"/>
      <text x="16" y="34" font-weight="700" fill="var(--ink)">patch, hunk 2 only</text>
      <rect x="16" y="56" width="458" height="54" rx="4" fill="none" stroke="var(--slate)" stroke-width="2" stroke-dasharray="7 6"/><text x="30" y="90" fill="var(--muted)">hunk 1 left out: shift 0</text>
      <rect x="16" y="126" width="458" height="54" rx="4" fill="var(--amber)"/><text x="30" y="160" font-weight="700" fill="var(--onwagon)">hunk 2  @@ -40,2 +40,2 @@</text>
      <text x="16" y="210" fill="var(--muted)">new start = old start + shift</text></g>
    <text x="60" y="430" fill="var(--ink)" font-weight="700">shift adds new minus old line counts of the selected hunks above</text>
    <text x="60" y="460" fill="var(--muted)">a pure insertion starts at old + 1, a pure deletion at old - 1</text>
    <text x="60" y="490" fill="var(--muted)">a start copied from the full diff lands an insertion a line early, and git apply still exits 0</text>
  </g>
</svg>
</div>
