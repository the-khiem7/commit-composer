<!-- Source of ../<id>.webp and ../<id>-dark.webp (banner-social is a PNG). Render from the repository root with:
     uvx --from playwright --with pillow python -I <frontdoor-illustrate>/scripts/render.py assets/source/plat.html --root assets --out assets
     Each .item is 1200 CSS px wide, so 2400 px in the image.
     Animated banner (replaces the still banner.webp and banner-dark.webp; run after the command above):
     uvx --from playwright --with pillow python -I <frontdoor-readme>/scripts/animate.py assets/source/plat.html --root assets --item banner --call "drawBanner({v})" --name banner --motion sway --amp 9 --frames 30 --size 1800x765 --quality 55 --out assets
     Signature note:
     1. Concept: a subdivision plat. One parcel is divided into lots, each lot is recorded under its own title, and nothing is recorded until the plan is signed.
     2. Shape language: irregular parcel outlines with dashed lot lines, hollow survey monuments at the corners, hatch fills that name the lot (fix a rising slash in teal, feat a falling slash in ochre, docs vertical bars in vermilion), a bordered title block with a signature line; no characters, no perspective.
     3. Typeface: Bricolage Grotesque 800 for display, Fragment Mono for every label and commit title.
     4. Palette logic: survey navy ink on bone paper; teal, ochre and vermilion are the three lots and keep their hatch in every picture; green only for a passed gate; the dark theme is a night survey sheet with each lot raised one step.
     5. Presentation: one parcel on the left, the schedule and the title block on the right; labels are real commit titles in the convention's format with fictional projects, and the real OK lines of the kit.
     6. Not: a blueprint cliche, a map pin, a railway, a git graph of circles, a gradient.
     Fonts and grounds printed by render.py: Bricolage Grotesque, Fragment Mono; light rgb(235, 233, 224), dark rgb(12, 22, 32). -->

<script>
(function () {
  var ns = "http://www.w3.org/2000/svg";
  var lots = document.getElementById("lots"), lines = document.getElementById("lines");
  function poly(parent, pts, attrs) { var p = document.createElementNS(ns, "polygon"); p.setAttribute("points", pts.map(function (q) { return q.join(","); }).join(" ")); for (var k in attrs) p.setAttribute(k, attrs[k]); parent.appendChild(p); }
  function seg(parent, x1, y1, x2, y2) { var l = document.createElementNS(ns, "line"); l.setAttribute("x1", x1); l.setAttribute("y1", y1); l.setAttribute("x2", x2); l.setAttribute("y2", y2); parent.appendChild(l); }
  // v is a few pixels: the two lot lines lean one way, then the other
  window.drawBanner = function (v) {
    v = v || 0;
    lots.innerHTML = ""; lines.innerHTML = "";
    var a1 = 318 + v, a2 = 300 + v, b1 = 530 - v, b2 = 545 - v;
    poly(lots, [[0, 150], [a1, 150], [a2, 480], [0, 480]], { fill: "url(#h1)" });
    poly(lots, [[a1, 150], [b1, 150], [b2, 480], [a2, 480]], { fill: "url(#h2)" });
    poly(lots, [[b1, 150], [800, 150], [800, 480], [b2, 480]], { fill: "url(#h3)" });
    seg(lines, a1, 150, a2, 480); seg(lines, b1, 150, b2, 480);
  };
  window.drawBanner(0);
})();
</script>
